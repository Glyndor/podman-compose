name: Debian package

on:
  push:
    branches:
      - develop
    paths:
      - "debian/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "internal/**"
      # debian/rules is the only caller that builds the test targets with
      # --no-default-features --features watch,completions, so it is the only
      # place a feature-gating mistake in the test tree is visible. Leaving
      # tests/ out of this filter hid a broken develop across twenty pull
      # requests (#1295): every other lane builds with test-helpers or
      # all-features and compiles the same code fine.
      - "tests/**"
      - ".github/workflows/debian-build.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "debian/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "internal/**"
      # debian/rules is the only caller that builds the test targets with
      # --no-default-features --features watch,completions, so it is the only
      # place a feature-gating mistake in the test tree is visible. Leaving
      # tests/ out of this filter hid a broken develop across twenty pull
      # requests (#1295): every other lane builds with test-helpers or
      # all-features and compiles the same code fine.
      - "tests/**"
      - ".github/workflows/debian-build.yml"

permissions:
  contents: read

jobs:
  debian:
    # Pinned at an untagged commit while the reusable is proven on a real
    # consumer, which is what the CI standard asks for before a tag is cut -
    # .github's own CI never exercises a caller. The comment becomes
    # # v1.17.0 before this merges.
    uses: Glyndor/.github/.github/workflows/rust-debian.yml@e70ff47fd8aefa0f054846815f19b98768d61122
    with:
      package-name: podup
      check-vendored: true
      offline-cargo-args: "--no-default-features --features watch,completions"
      # debian/rules builds for musl so the package carries no libc floor, and
      # Debian's toolchain ships no musl standard library. Keep this in step
      # with rust-ci.yml's default: the whole point is that the packaged binary
      # comes from the compiler CI validates with.
      rust-toolchain: "1.97"
      rust-target: x86_64-unknown-linux-musl
