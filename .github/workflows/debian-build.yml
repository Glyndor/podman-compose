name: Debian package

on:
  push:
    branches:
      - develop
    paths:
      - "debian/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "internal/**"
      # debian/rules is the only caller that builds the test targets with
      # --no-default-features --features watch,completions, so it is the only
      # place a feature-gating mistake in the test tree is visible. Leaving
      # tests/ out of this filter hid a broken develop across twenty pull
      # requests (#1295): every other lane builds with test-helpers or
      # all-features and compiles the same code fine.
      - "tests/**"
      - ".github/workflows/debian-build.yml"
      # The release job builds the .deb too, in its own container, and until
      # this line a change to it triggered nothing. That is the shape of #1295:
      # the filter left tests/** out, and a broken develop rode twenty pull
      # requests because the one lane that compiles with debian/rules' feature
      # set never ran. A gate that does not run is indistinguishable from one
      # that passes.
      - ".github/workflows/release.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "debian/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "internal/**"
      # debian/rules is the only caller that builds the test targets with
      # --no-default-features --features watch,completions, so it is the only
      # place a feature-gating mistake in the test tree is visible. Leaving
      # tests/ out of this filter hid a broken develop across twenty pull
      # requests (#1295): every other lane builds with test-helpers or
      # all-features and compiles the same code fine.
      - "tests/**"
      - ".github/workflows/debian-build.yml"
      # The release job builds the .deb too, in its own container, and until
      # this line a change to it triggered nothing. That is the shape of #1295:
      # the filter left tests/** out, and a broken develop rode twenty pull
      # requests because the one lane that compiles with debian/rules' feature
      # set never ran. A gate that does not run is indistinguishable from one
      # that passes.
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  debian:
    # v1.17.0 added rust-toolchain and rust-target. It was pinned here at the
    # untagged commit first, because the CI standard asks for a reusable to be
    # proven on a real consumer before its tag is cut - .github's own CI never
    # exercises a caller. This repository's dpkg-buildpackage job was that
    # proof, going from red to green in 6m36s on #1525.
    uses: Glyndor/.github/.github/workflows/rust-debian.yml@d5041b038b7d4935e75400dff612962e6fa14893 # v1.21.0
    with:
      package-name: podup
      check-vendored: true
      offline-cargo-args: "--no-default-features --features watch,completions"
      # debian/rules builds for musl so the package carries no libc floor, and
      # Debian's toolchain ships no musl standard library. Keep this in step
      # with rust-ci.yml's default: the whole point is that the packaged binary
      # comes from the compiler CI validates with.
      rust-toolchain: "1.98"
      rust-target: x86_64-unknown-linux-musl
