name: Debian package

on:
  push:
    branches:
      - develop
    paths:
      - "debian/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "internal/**"
      # debian/rules is the only caller that builds the test targets with
      # --no-default-features --features watch,completions, so it is the only
      # place a feature-gating mistake in the test tree is visible. Leaving
      # tests/ out of this filter hid a broken develop across twenty pull
      # requests (#1295): every other lane builds with test-helpers or
      # all-features and compiles the same code fine.
      - "tests/**"
      - ".github/workflows/debian-build.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "debian/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "internal/**"
      # debian/rules is the only caller that builds the test targets with
      # --no-default-features --features watch,completions, so it is the only
      # place a feature-gating mistake in the test tree is visible. Leaving
      # tests/ out of this filter hid a broken develop across twenty pull
      # requests (#1295): every other lane builds with test-helpers or
      # all-features and compiles the same code fine.
      - "tests/**"
      - ".github/workflows/debian-build.yml"

permissions:
  contents: read

jobs:
  debian:
    uses: Glyndor/.github/.github/workflows/rust-debian.yml@3a46ffe91ecadcce7f14c99ea8b23ead4274f325 # v1.13.2
    with:
      package-name: podup
      check-vendored: true
      offline-cargo-args: "--no-default-features --features watch,completions"
