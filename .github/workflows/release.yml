name: release

# Trigger is push on a v* tag, plus workflow_dispatch with a tag input. A tag
# push is the only natural release event (a release is a tag), and I added
# dispatch so a release that started from a tag push but failed partway can be
# retried against the same tag, without bumping the version.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.3.0)"
        required: true

permissions: {}

jobs:
  verify:
    name: Verify tag matches crate version
    runs-on: ubuntu-latest
    # Bound: worst of the last three successful runs on 2026-09-02 was 189s. Ten times that, rounded up, never under ten
    # minutes; the six-hour default is what a hang would otherwise cost.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The only checkout in this repository that keeps the token: the step
        # below runs `git fetch origin main` to prove the tag is reachable from
        # main, and this is the release path, which runs once, at the tag, on
        # a release that is immutable. The repository is public, so an
        # anonymous fetch would work today; it is not worth learning otherwise
        # at release time. This job holds no signing key.
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Validate tag format
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '${TAG}' does not match required format v<major>.<minor>.<patch>."
            exit 1
          fi

      - name: Tag must equal Cargo.toml version
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          CRATE_VERSION="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "$VERSION" != "$CRATE_VERSION" ]; then
            echo "::error::Tag ${TAG} does not match Cargo.toml version ${CRATE_VERSION}."
            exit 1
          fi
          echo "Releasing version ${VERSION}."

      - name: Debian package version must equal Cargo.toml version
        # dpkg-buildpackage takes the .deb version from debian/changelog, which
        # is a separate hand-maintained file. 1.9.0 shipped with the bump applied
        # to Cargo.toml but not here, so the release carried podup_1.8.0_*.deb:
        # apt saw the version it already had, reported no upgrade, and Debian
        # users were stranded — with no self-update either, since podup redirects
        # a dpkg-owned binary to `apt upgrade`. The tag check above cannot catch
        # this; only comparing the two versions can.
        run: |
          # Read the version off the first line rather than with
          # dpkg-parsechangelog: that tool lives in dpkg-dev, which this job
          # never installs, and a gate that only runs at tag time must not
          # depend on what happens to be on the runner image. The first-line
          # format is fixed by Debian policy.
          DEB_VERSION="$(sed -n '1s/^[^(]*(\([^)]*\)).*/\1/p' debian/changelog)"
          CRATE_VERSION="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "$DEB_VERSION" != "$CRATE_VERSION" ]; then
            echo "::error::debian/changelog is at ${DEB_VERSION} but Cargo.toml is at ${CRATE_VERSION}; add a changelog entry so the .deb carries the released version."
            exit 1
          fi
          echo "Debian package version ${DEB_VERSION} matches."

      - name: Cargo.lock must record the released version
        # Cargo.lock carries podup's own version too, and `cargo build --locked`
        # in the build jobs would catch a stale one — but only after the matrix
        # has started, mid-release. Gate it here in verify, before anything is
        # built, so all three version files (Cargo.toml, debian/changelog,
        # Cargo.lock) are proven to agree at the same fail-fast point. Match the
        # version on the line right after the podup package's name entry, not any
        # dependency that happens to share the number.
        run: |
          CRATE_VERSION="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          LOCK_VERSION="$(awk -F'"' '/^name = "podup"$/{getline; if ($0 ~ /^version = /) {print $2; exit}}' Cargo.lock)"
          if [ "$LOCK_VERSION" != "$CRATE_VERSION" ]; then
            echo "::error::Cargo.lock records podup ${LOCK_VERSION:-<none>} but Cargo.toml is at ${CRATE_VERSION}; run cargo update -p podup so the lockfile matches."
            exit 1
          fi
          echo "Cargo.lock version ${LOCK_VERSION} matches."

      - name: Tag must be on main
        # Releases are cut only from `main` (develop → main merge, then tag).
        # Refuse a tag pushed to any other branch so an unreviewed commit can
        # never be published.
        run: |
          git fetch --unshallow --no-tags origin main 2>/dev/null \
            || git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tagged commit is not reachable from origin/main; releases must be cut from main."
            exit 1
          fi

      - name: Audit dependencies for known advisories
        # Gate the release on `cargo audit`: a RUSTSEC advisory in a pinned
        # dependency must block publishing, not wait for the weekly cron scan.
        #
        # `--deny warnings`, matching reusable-rust-audit.yml. Without it this
        # step was the WEAKER of the two gates: the weekly cron failed on a
        # warning-level advisory and the release did not, so the check standing
        # in front of the immutable artifact was the more permissive one. An
        # unmaintained or yanked crate is a warning, and a release is the one
        # place a warning cannot be looked at again later.
        #
        # The third-party-timing rule that keeps this off ordinary pull requests
        # does not apply here and the asymmetry is deliberate: a blocked release
        # is fixed by releasing again, and a published one cannot be fixed at
        # all.
        run: |
          cargo install cargo-audit --version "=0.22.2" --locked
          cargo audit --deny warnings

  build:
    name: Build ${{ matrix.asset }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    # Bound: worst of the last three successful runs on 2026-09-02 was 347s; the slowest leg is Windows arm64. Ten times that, rounded up, never under ten
    # minutes; the six-hour default is what a hang would otherwise cost.
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: podup-linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin: podup
          - asset: podup-linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            bin: podup
          - asset: podup-darwin-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            bin: podup
          - asset: podup-darwin-x86_64
            runner: macos-latest
            target: x86_64-apple-darwin
            bin: podup
          - asset: podup-windows-x86_64.exe
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bin: podup.exe
          # Cross-compiled from the x64 Windows runner: the aarch64 toolchain
          # is added with rustup, and the signing step's Python wheels are only
          # published for x64 Windows (no native arm64 wheel exists).
          - asset: podup-windows-arm64.exe
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            bin: podup.exe

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Install build target
        env:
          TARGET: ${{ matrix.target }}
          # Keep this in step with the `toolchain` default in this repository's
          # reusable-rust-ci.yml, which is where that file lives since #1568.
          # pin-watch.yml reads both, along with the other seven sites that
          # write this number, and reports them disagreeing.
          #
          # It is NOT a repo-root rust-toolchain.toml on purpose: that
          # file is a directory override that beats `rustup default`, so it would
          # silently pull the MSRV job (which does `rustup default <msrv>`) up to
          # this version and defeat the MSRV gate. A release still must not float
          # on whatever Rust the runner ships, so pin it here, in the release path
          # only.
          RUST_TOOLCHAIN: "1.98"
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq musl-tools
          fi
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add "$TARGET"

      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage artifact
        run: cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${{ matrix.asset }}"

      - name: Sign binary
        env:
          GLYNDOR_RELEASE_ED25519_KEY: ${{ secrets.GLYNDOR_RELEASE_ED25519_KEY }}
          PYTHONUTF8: "1"
        run: |
          # The installer/updater verifies this Ed25519 signature; a release
          # without it cannot be consumed. Rotation is by dual-TRUST — consumers
          # bake both accepted public keys — so only the active key signs here,
          # producing the single .sig every verifier reads. Fail closed when the
          # key is absent instead of publishing unsigned binaries.
          if [ -z "$GLYNDOR_RELEASE_ED25519_KEY" ]; then
            echo "::error::GLYNDOR_RELEASE_ED25519_KEY is not configured; refusing to release unsigned binaries."
            exit 1
          fi
          # Install the signing dependencies into an isolated virtual
          # environment: a runner image may ship a different, system-managed
          # cryptography that pip can neither uninstall (no RECORD) nor write
          # over (read-only prefix). A fresh venv honours the pin on every OS.
          python3 -m venv "$RUNNER_TEMP/signvenv"
          venv_py="$RUNNER_TEMP/signvenv/bin/python"
          [ -x "$venv_py" ] || venv_py="$RUNNER_TEMP/signvenv/Scripts/python.exe"
          "$venv_py" -m pip install --quiet --require-hashes -r .github/scripts/sign-requirements.txt
          # Keys are passed via the environment, not argv, so they never appear
          # in the process argument list.
          "$venv_py" .github/scripts/sign.py "${{ matrix.asset }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sig
          retention-days: 1
          if-no-files-found: error

  build-deb:
    name: Build Debian package (${{ matrix.arch }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    # Bound: worst of the last three successful runs on 2026-09-02 was 438s. Ten times that, rounded up, never under ten
    # minutes; the six-hour default is what a hang would otherwise cost.
    timeout-minutes: 60
    # debian:trixie, digest-pinned. Sid was a moving tag:
    # two releases built from identical source could land in different
    # environments with nothing in history recording which, and Dependabot's
    # github-actions ecosystem does not bump a workflow's `container:` image,
    # so a digest of sid would have no bump path and freeze. Trixie is stable
    # and matches the suite CI validates against.
    #
    # It is meant to be the same image reusable-rust-debian.yml defaults to,
    # so the release that ships to users comes out of the environment the
    # debian-build lane exercised. Measured 2026-08-28, the two digests are
    # different and were before #1568 too, so that sentence has never been
    # true here. pin-watch.yml now reads both and reports the disagreement
    # every Monday; choosing which one wins changes what gets built and is
    # not settled in #1582.
    container: debian:trixie@sha256:f324c7ff54321e8d9c588493a20244965938ce0aa50bbd1022d38010e9ffc4b1
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Install build tooling
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            ca-certificates \
            build-essential \
            dpkg-dev \
            debhelper \
            curl \
            musl-tools

      - name: Install the pinned Rust toolchain and the musl target
        env:
          # The same pin the `build` job uses, and the same one rust-ci.yml
          # defaults to. Before this the package was compiled by Debian's rustc
          # while CI validated with 1.97, so the binary users installed came
          # from a compiler the suite had never run against.
          RUST_TOOLCHAIN: "1.98"
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$ARCH" in
            amd64) target=x86_64-unknown-linux-musl ;;
            arm64) target=aarch64-unknown-linux-musl ;;
            *) echo "::error::no musl target mapped for $ARCH"; exit 1 ;;
          esac
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
          . "$HOME/.cargo/env"
          # Targets are per-toolchain, so this has to name the pinned one
          # rather than whatever happens to be default.
          rustup target add "$target" --toolchain "$RUST_TOOLCHAIN"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Build the package
        run: |
          # dpkg-buildpackage builds for the host architecture, so each runner
          # produces its own arch's .deb natively.
          dpkg-checkbuilddeps
          dpkg-buildpackage -us -uc -b

      - name: Stage the .deb into the workspace
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          deb=$(find .. -maxdepth 1 -name "podup_*_${ARCH}.deb" | sort | head -n1)
          if [ -z "$deb" ]; then
            echo "::error::no ${ARCH} .deb artifact was produced"
            exit 1
          fi
          cp "$deb" "$(basename "$deb")"
          echo "Staged $(basename "$deb")"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: podup_*_${{ matrix.arch }}.deb

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: podup-deb-${{ matrix.arch }}
          path: podup_*_${{ matrix.arch }}.deb
          retention-days: 1
          if-no-files-found: error

  # SBOM generation runs here, in its own job, so a third-party build script
  # executed by `cargo install` cannot reach the signing step. cargo install
  # builds every crate in the dependency tree of cargo-cyclonedx and
  # cargo-about (427 crates across the two, several under live RustSec
  # advisories), and `build.rs` has full filesystem access on the runner that
  # runs it. The release job holds GLYNDOR_RELEASE_ED25519_KEY on its signing
  # step; if SBOM generation lived in the same job, a malicious build script
  # could persist in the workspace and rewrite `.github/scripts/sign.py` or
  # `.github/scripts/sign-requirements.txt` before the signing step ran them
  # with the key in its environment. This job holds `contents: read` and no
  # secrets, so persistence here has nothing to land on. See Glyndor/apt#121.
  sbom:
    name: Generate SBOM and license attribution
    needs: [build, build-deb]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    # Bound: worst of the last three successful runs on 2026-09-02 was 216s. Ten times that, rounded up, never under ten
    # minutes; the six-hour default is what a hang would otherwise cost.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Install Rust toolchain
        # Pin rather than `stable`: a release runs once at tag time and is
        # immutable, so it must not be built by whatever Rust the runner ships
        # that day. Keep in step with rust-ci.yml's toolchain default (see the
        # build job for why this is not a repo-root rust-toolchain.toml).
        env:
          RUST_TOOLCHAIN: "1.98"
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Generate per-target SBOMs and license attribution
        # Government/enterprise consumers require a machine-readable SBOM
        # (CycloneDX, per US EO 14028). A single --all-features run over-declares
        # every artifact: the .deb drops the self-update stack (ureq/TLS/Ed25519)
        # and each OS pulls different cfg-gated deps, yet all shipped the same
        # union SBOM. Generate one CycloneDX per released artifact with that
        # artifact's exact target triple and feature set, so each lists only what
        # its binary actually contains (releases standard: "the per-artifact SBOM
        # lists only that platform's dependencies").
        #
        # cargo-cyclonedx's --target uses cargo's --filter-platform resolution,
        # which needs only the triple, not an installed std — so the six
        # cross-platform binary targets resolve here without `rustup target add`.
        # The binaries carry the default feature set; the .debs are built
        # --no-default-features --features watch,completions (debian/rules), so
        # their SBOMs pass the same flags or they would misdeclare the package.
        # License attribution (NOTICES.html) stays a single union — over-listing
        # licenses is the safe direction for attribution, never under-listing.
        run: |
          cargo install --locked cargo-cyclonedx --version "=0.5.9"
          cargo install --locked --features cli cargo-about --version "=0.9.0"

          # $1 = output basename (the artifact the SBOM describes; ".cdx.json" is
          #      appended), $2 = target triple, $3.. = extra cargo-cyclonedx flags.
          gen_sbom() {
            local out="$1" target="$2"
            shift 2
            cargo cyclonedx --format json --target "$target" \
              --override-filename "${out}.cdx" "$@"
          }

          # Binaries — default feature set, one SBOM per target triple.
          gen_sbom podup-linux-x86_64        x86_64-unknown-linux-musl
          gen_sbom podup-linux-arm64         aarch64-unknown-linux-musl
          gen_sbom podup-darwin-arm64        aarch64-apple-darwin
          gen_sbom podup-darwin-x86_64       x86_64-apple-darwin
          gen_sbom podup-windows-x86_64.exe  x86_64-pc-windows-msvc
          gen_sbom podup-windows-arm64.exe   aarch64-pc-windows-msvc

          # Debian packages — the packaged binary drops the `update` feature and
          # links glibc (gnu), not musl. Name each SBOM after its own .deb.
          for arch in amd64 arm64; do
            case "$arch" in
              amd64) triple=x86_64-unknown-linux-gnu ;;
              arm64) triple=aarch64-unknown-linux-gnu ;;
            esac
            deb="$(ls podup_*_"${arch}".deb)"
            gen_sbom "$deb" "$triple" --no-default-features --features watch,completions
          done

          cargo about generate about.hbs > NOTICES.html

      - name: Upload SBOM and NOTICE artifacts
        # if-no-files-found: error matters: a silent empty upload would let the
        # release job sign nothing and still succeed, defeating the SBOM gate.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: |
            *.cdx.json
            NOTICES.html
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, build-deb, sbom]
    runs-on: ubuntu-latest
    # Bound: worst of the last three successful runs on 2026-09-02 was 33s. Ten times that, rounded up, never under ten
    # minutes; the six-hour default is what a hang would otherwise cost.
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Install Rust toolchain
        # Pin rather than `stable`: a release runs once at tag time and is
        # immutable, so it must not be built by whatever Rust the runner ships
        # that day. Keep in step with rust-ci.yml's toolchain default (see the
        # build job for why this is not a repo-root rust-toolchain.toml).
        env:
          RUST_TOOLCHAIN: "1.98"
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Verify both Debian packages are present
        run: |
          for arch in amd64 arm64; do
            if ! ls podup_*_${arch}.deb >/dev/null 2>&1; then
              echo "::error::Debian package artifact for ${arch} is missing"
              exit 1
            fi
          done

      - name: Generate checksums
        run: |
          sha256sum \
            podup-linux-x86_64 \
            podup-linux-arm64 \
            podup-darwin-arm64 \
            podup-darwin-x86_64 \
            podup-windows-x86_64.exe \
            podup-windows-arm64.exe \
            podup_*_amd64.deb \
            podup_*_arm64.deb \
            podup-linux-x86_64.cdx.json \
            podup-linux-arm64.cdx.json \
            podup-darwin-arm64.cdx.json \
            podup-darwin-x86_64.cdx.json \
            podup-windows-x86_64.exe.cdx.json \
            podup-windows-arm64.exe.cdx.json \
            podup_*_amd64.deb.cdx.json \
            podup_*_arm64.deb.cdx.json \
            NOTICES.html \
            install.sh \
            install.ps1 \
            > SHA256SUMS

      - name: Sign SHA256SUMS and the Debian packages
        env:
          GLYNDOR_RELEASE_ED25519_KEY: ${{ secrets.GLYNDOR_RELEASE_ED25519_KEY }}
          PYTHONUTF8: "1"
        run: |
          if [ -z "$GLYNDOR_RELEASE_ED25519_KEY" ]; then
            echo "::error::GLYNDOR_RELEASE_ED25519_KEY is not configured; refusing to release unsigned checksums."
            exit 1
          fi
          # Isolated venv so the pinned cryptography is honoured regardless of
          # any system-managed copy on the runner (see the per-binary sign step).
          python3 -m venv "$RUNNER_TEMP/signvenv"
          venv_py="$RUNNER_TEMP/signvenv/bin/python"
          [ -x "$venv_py" ] || venv_py="$RUNNER_TEMP/signvenv/Scripts/python.exe"
          "$venv_py" -m pip install --quiet --require-hashes -r .github/scripts/sign-requirements.txt
          # The key is read from GLYNDOR_RELEASE_ED25519_KEY in the environment, not argv.
          "$venv_py" .github/scripts/sign.py SHA256SUMS
          for deb in podup_*_amd64.deb podup_*_arm64.deb; do
            "$venv_py" .github/scripts/sign.py "$deb"
          done
          # Sign the supply-chain artifacts so consumers can verify them offline.
          # Every per-target SBOM (the only *.cdx.json files in the workspace).
          for sbom in *.cdx.json; do
            "$venv_py" .github/scripts/sign.py "$sbom"
          done
          "$venv_py" .github/scripts/sign.py NOTICES.html
          # Sign the installers so a user pinning PODUP_VERSION can verify the
          # script they pipe to a shell, not just the binaries it fetches.
          "$venv_py" .github/scripts/sign.py install.sh
          "$venv_py" .github/scripts/sign.py install.ps1

      - name: Verify every signature against the keys consumers embed
        run: |
          # sign.py only checks the seed is base64 of 32 bytes, so a wrong-but-
          # well-formed GLYNDOR_RELEASE_ED25519_KEY signs happily and publishes a
          # release nothing can verify. Releases are immutable, so that mistake
          # burns the version. Verify, here and once, what every installer does
          # on every machine - and what install.sh / install.ps1 do for
          # SHA256SUMS is only half the story. Every per-asset .sig (per-binary,
          # per-deb, per-SBOM, per-installer) carries the same trust: a per-
          # binary substitution is the failure mode SHA256SUMS cannot catch
          # (the manifest can be re-signed to match the swapped binary), so
          # iterate every .sig in the workspace and verify it the same way.
          # A mismatch on any one fails the release instead of shipping it.
          venv_py="$RUNNER_TEMP/signvenv/bin/python"
          [ -x "$venv_py" ] || venv_py="$RUNNER_TEMP/signvenv/Scripts/python.exe"
          "$venv_py" .github/scripts/verify-signing-key.py SHA256SUMS
          shopt -s nullglob
          for sig in *.sig; do
            base="${sig%.sig}"
            "$venv_py" .github/scripts/verify-signing-key.py "$base" "$sig"
          done

      - name: Verify every file the installers fetch is staged
        run: |
          set -euo pipefail
          # The asset-contract gate compares install.sh against this file and
          # answers "do the two agree on the names". It cannot answer "does the
          # release produce them" — a workflow file is a statement of intent,
          # not proof that a step ran. This is where that question is
          # answerable: everything is built, signed and checksummed, and the
          # release is not immutable yet. The script derives what to look for
          # from install.sh's own ${BASE_URL} fetches, so it covers
          # SHA256SUMS.sig too — install.sh aborts without it, and nothing
          # upstream of here ever checked it was produced.
          python3 scripts/verify-release-assets.py \
            --workdir . \
            --install-script install.sh \
            --install-ps1 install.ps1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --generate-notes \
            --verify-tag \
            podup-linux-x86_64 \
            podup-linux-x86_64.sig \
            podup-linux-arm64 \
            podup-linux-arm64.sig \
            podup-darwin-arm64 \
            podup-darwin-arm64.sig \
            podup-darwin-x86_64 \
            podup-darwin-x86_64.sig \
            podup-windows-x86_64.exe \
            podup-windows-x86_64.exe.sig \
            podup-windows-arm64.exe \
            podup-windows-arm64.exe.sig \
            podup_*_amd64.deb \
            podup_*_amd64.deb.sig \
            podup_*_arm64.deb \
            podup_*_arm64.deb.sig \
            SHA256SUMS \
            SHA256SUMS.sig \
            podup*.cdx.json \
            podup*.cdx.json.sig \
            NOTICES.html \
            NOTICES.html.sig \
            install.sh \
            install.sh.sig \
            install.ps1 \
            install.ps1.sig

      - name: Remove release artifacts
        run: rm -f podup-* podup_* NOTICES.html* SHA256SUMS SHA256SUMS.sig install.sh.sig install.ps1.sig
