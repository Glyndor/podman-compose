name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  rust:
    uses: ./.github/workflows/reusable-rust-ci.yml
    with:
      # Each entry here becomes its own check name: `rust / Test (macos-latest)`
      # and `rust / Test (windows-latest)`. Editing this list changes the names
      # emitted while the ruleset still requires the old ones, so the PR
      # carrying the edit blocks itself. A ruleset should require the stable
      # gate `rust / Extra platforms` instead, which names no platform. #1552.
      extra-test-os: "[\"macos-latest\", \"windows-latest\"]"
      # Measured against the WHOLE crate, deliberately. The gate used to read 90%
      # while a `coverage-ignore-regex` hid 36% of the code — 14,432 of 39,681
      # regions — so it protected 58% of podup at 90% and said nothing about the
      # rest. The exclusion was justified when those modules ran under a live
      # Podman in this job; `a5cd4b4` removed that in June 2026 and the
      # justification expired with it. Since then the only thing exercising them
      # was `podman-lane`, which counts passing tests and compares failing
      # identities but measures no coverage at all.
      #
      # 79 is lower than 90 and stricter than it was: 100% of the crate at 79
      # leaves nothing invisible, where 90 of 63% left a third of podup
      # unmeasured. It is a ratchet, not a target — raise it when real coverage
      # rises, never lower it to make a red build green.
      #
      # It is deliberately NOT the measured 78.96%: a floor set exactly at
      # today's number turns any unrelated refactor that moves one region into a
      # failed build.
      # 79, not the org standard's 90, and not because podup is short of it.
      #
      # Measured 2026-08-03: the full suite covers **91.52%** of lines. This job
      # cannot run it — the integration tests need a live Podman and skip
      # themselves on a runner without one — so what it measures is `--lib
      # --bins` alone, which is **79.39%**. The two numbers describe different
      # things and only one of them is checkable here.
      #
      # 75 left four points of silent slack on a figure that is already a
      # subset: coverage could fall from 79 to 75 with nothing saying so. This
      # locks in what holds today rather than demanding new work, which is what
      # the testing standard asks for when adopting a floor.
      #
      # The 90 gate belongs where the tests can actually run — the `podman-vm`
      # lane — and that is tracked separately rather than papered over here.
      # 72 is lower than 79 and the gate got stricter, not looser. Measured
      # 2026-09-02 with the CI command (cargo llvm-cov --workspace
      # --all-features, no Podman reachable) on the same commit before and
      # after the 124 inline test modules moved to sibling files: 82.08%
      # (24402 of 29728 lines) became 73.12% (14309 of 19570) on the owner's
      # machine, and the Coverage job on the pull request that carried the
      # move (#1634) read 73.09%. The 10158 lines that left the denominator
      # were test bodies that cargo-llvm-cov had counted as covered production
      # lines of the files they sat in, so the old number measured test volume
      # as well as reach. One point under what CI measured is the honest floor
      # that holds today. It is a ratchet, not a target: raise it when real
      # coverage rises, never lower it to make a red build green. See
      # standards/testing, "An inline test module is counted as covered
      # production code".
      coverage-threshold: 72
      # This number is inside the check name `rust / MSRV (1.85)`. Bumping it
      # emits `rust / MSRV (<new>)` while the ruleset still requires the old
      # string, so the PR carrying the bump blocks itself. A ruleset should
      # require the stable gate `rust / MSRV` instead, which carries no
      # version. See #1552.
      msrv: "1.85"
      # `cargo publish --dry-run`, and podup is no longer published (#1606).
      package-check: false
      # A semver promise needs somebody to make it to. There is nobody.
      semver-check: false
      doc-warnings: true

  # A cron that stops firing emits nothing, and "no alert" is indistinguishable
  # from "all clear". Every scheduled workflow in this org went dark on
  # 2026-06-29; four repos stayed dark for another four weeks while reporting
  # `active` the whole time, and it cost a real finding. These turn the absence
  # of a scheduled run into a red check on ordinary work.
  #
  # max-age-days allows about two periods, so one miss is tolerated:
  # 15 for weekly, 3 for daily, 65 for the monthly benchmark.
  freshness-audit:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-schedule-freshness.yml
    with:
      workflow: audit.yml
      max-age-days: 15

  freshness-fuzz:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-schedule-freshness.yml
    with:
      workflow: fuzz.yml
      max-age-days: 15

  freshness-podman-lane:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-schedule-freshness.yml
    with:
      workflow: podman-lane.yml
      max-age-days: 3

  freshness-podman-watch:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-schedule-freshness.yml
    with:
      workflow: podman-watch.yml
      max-age-days: 3

  # A newly added scheduled workflow cannot be registered here in the same pull
  # request that adds it. The guard passes only on a run with `event=schedule`
  # and `status=success`; GitHub fires crons solely from the default branch, and
  # `workflow_dispatch` does not count. So a fresh entry fails with "No
  # successful scheduled run on record" until the workflow has reached `main`
  # and its cron has fired once. `pin-watch.yml` (#1526) is waiting for exactly
  # that and gets its entry afterwards.

  # Monthly (`0 4 1 * *`), so seventeen days without a run is normal and a
  # weekly threshold here would fail on ordinary work for most of the month.
  freshness-benchmark:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-schedule-freshness.yml
    with:
      workflow: benchmark.yml
      max-age-days: 65

  # Dependabot silently stops proposing updates when its config is not
  # re-registered, and like a dead cron it reports nothing at all. This fails
  # when no pull request has been opened recently enough.
  #
  # v1.16.0 read one page of twenty pull requests and filtered it for the bot,
  # which measures how busy the repository is rather than whether Dependabot is
  # running: run 32435521566 reported "no Dependabot pull request on record"
  # while ten sat open. v1.16.1 pages the window.
  dependabot-freshness:
    uses: ./.github/workflows/reusable-dependabot-freshness.yml
    with:
      max-age-days: 15
