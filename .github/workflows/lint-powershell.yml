name: Lint PowerShell scripts

on:
  push:
    branches:
      - develop
    paths:
      - "**.ps1"
      - ".github/workflows/lint-powershell.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "**.ps1"
      - ".github/workflows/lint-powershell.yml"

permissions:
  contents: read

jobs:
  psscriptanalyzer:
    name: PSScriptAnalyzer
    uses: Glyndor/.github/.github/workflows/powershell-ci.yml@c958978687af37dc2d826a967d9c549589afb39f # v1.14.1
    with:
      paths: "install.ps1"
      # install.ps1 is piped to `iex`, so human-facing status must go through
      # Write-Host — Write-Output would leak into the stream the pipe feeds.
      # Same exclusion the previous inline job carried.
      exclude-rules: "PSAvoidUsingWriteHost"
