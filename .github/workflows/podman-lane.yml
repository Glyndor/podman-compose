name: podman-lane
# Live-Podman integration for podup, validated against the FULL supported window.
# Support policy: the latest Podman major + the one below it — today Podman 5 and 6.
# Every engine PR runs the integration suite on BOTH majors (matrix), each inside a
# Fedora qemu VM booted in the runner (nested-virt — the ubuntu-24.04 runner exposes
# /dev/kvm) with full systemd, as a rootless user. Podman 6 = Fedora rawhide;
# Podman 5 = Fedora 44.
on:
  workflow_dispatch:
  # Nightly safety net on the default branch: catches a runtime regression that
  # slipped past PR review within 24h (a scheduled run reports on the default branch).
  schedule:
    - cron: "0 9 * * *"
  # Runs on EVERY pull request (no path filter) so it can be a required status
  # check that always reports — runtime behaviour is podup's whole point, so it
  # gates the merge. The internal suite distinguishes nested-virt flakes from real
  # failures and retries a transient once.
  pull_request:
permissions:
  contents: read
jobs:
  podman-vm:
    runs-on: ubuntu-24.04
    # Raised for the one-thread experiment: serialising the suite costs wall
    # clock, and a run that dies on the timeout answers nothing (#1039).
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        podman: ["5", "6"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install qemu + cloud tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 qemu-utils cloud-image-utils
      - name: Fetch Fedora cloud image (Podman 6 = rawhide, 5 = Fedora 44)
        run: |
          SEL="${{ matrix.podman }}"
          echo "PODMAN_MAJOR=$SEL"
          if [ "$SEL" = "5" ]; then
            base="https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/"
            img=$(curl -fsSL "$base" | grep -oE 'Fedora-Cloud-Base-Generic-44-[0-9.]+\.x86_64\.qcow2' | sort -u | tail -1)
          else
            base="https://dl.fedoraproject.org/pub/fedora/linux/development/rawhide/Cloud/x86_64/images/"
            img=$(curl -fsSL "$base" | grep -oE 'Fedora-Cloud-Base-Generic-Rawhide-[0-9]+\.n\.[0-9]+\.x86_64\.qcow2' | sort -u | tail -1)
          fi
          [ -n "$img" ] || { echo "::error::could not resolve a Fedora image name for Podman $SEL at $base"; exit 1; }
          echo "image: $img"
          # Carry it to the gate step. The name resolves to whatever compose is
          # newest at this moment, so the Podman 6 leg boots a DIFFERENT operating
          # system most days — and until now that fact lived only in the middle of
          # this step's log. Two runs of this leg are not the same environment, and
          # anyone comparing a failure against the run before it has to know which
          # one they got (#1222).
          echo "VM_IMAGE=$img" >> "$GITHUB_ENV"
          # The rawhide qcow2 is ~500 MB and the mirror occasionally drops the
          # connection mid-transfer (curl exit 18). Resume + retry so a transient
          # network blip doesn't fail the lane.
          curl -fSL --retry 5 --retry-delay 5 --retry-all-errors -C - -o "$RUNNER_TEMP/vm.qcow2" "${base}${img}"
          qemu-img resize "$RUNNER_TEMP/vm.qcow2" 40G
      - name: Build cloud-init seed (script-file for clean RC)
        run: |
          cat > "$RUNNER_TEMP/user-data" <<'EOF'
          #cloud-config
          growpart: {mode: auto, devices: ['/']}
          resize_rootfs: true
          users:
            - name: tester
              sudo: 'ALL=(ALL) NOPASSWD:ALL'
              shell: /bin/bash
          write_files:
            # Podman's default log driver on Fedora is journald, and in this image
            # every logs request comes back `500 ... unable to open a handle to the
            # library` — its go-systemd binding cannot open the journal. Installing
            # systemd-devel does not help (measured: the package installs and the
            # error persists), so rather than keep guessing at the dlopen, use the
            # file-based driver, which has no library to open.
            #
            # This is not cosmetic. With logs unavailable the suite's five logs
            # tests passed without fetching a byte — `logs` swallowed the 500 and
            # returned success, so their `unwrap()` succeeded on nothing.
            - path: /etc/containers/containers.conf
              content: |
                [containers]
                log_driver = "k8s-file"
            - path: /usr/local/bin/run-suite.sh
              permissions: '0755'
              content: |
                #!/bin/bash
                export XDG_RUNTIME_DIR=/run/user/$(id -u)
                systemctl --user start podman.socket
                export PODMAN_SOCKET=$XDG_RUNTIME_DIR/podman/podman.sock
                # In here Podman is guaranteed, so a test that cannot reach it
                # must fail rather than skip: a skipped test reports `ok`, and a
                # VM whose socket never came up would otherwise look like a
                # flawless 155-pass run and clear the floor comfortably.
                export PODUP_REQUIRE_PODMAN=1
                cd "$HOME/podup" || exit 90
                # Coverage runs on the scheduled and manual paths only — never on a
                # pull request. The number is worth having where the integration
                # tests can actually run (#1326: the CI coverage job sees 79% because
                # every integration test skips itself without Podman, while the full
                # suite covers 91.5%), but instrumenting doubles nothing here for
                # free: it is a second full build inside the VM. Gating on it is
                # deliberately NOT done yet — a threshold set from a number never
                # observed in this environment is how a phantom check gets born.
                COVERAGE=__COVERAGE__
                # Capture the FULL output: the per-failure detail (where the flake
                # marker lives) precedes the summary, so a `tail` on the console
                # would truncate it and hide why a test failed.
                # Retry once on a nested-virt transient (a dropped connection). A real
                # failure reproduces on the second run, so this stabilises the lane for
                # required-check gating without masking genuine bugs.
                #
                # WHAT COUNTS AS A DROP — defined once, used by both the retry above and
                # the FLAKY counter below, because the two drifting apart is how this
                # went wrong (#1104). The list used to hold only the head-level shapes,
                # and a dropped BODY is none of them: measured against a socket that
                # severs a chunked body on purpose, hyper reports a Body error wrapping
                # io UnexpectedEof, worded "unexpected EOF during chunk size line" when
                # the cut lands between chunks and IncompleteBody when it lands
                # mid-payload, with the Display form "error reading a body from
                # connection". None matched, so a drop mid-body was neither retried nor
                # counted — it just reddened the leg, which is exactly what happened to
                # fifteen streaming tests when a mid-stream error was made fatal.
                #
                # EXPERIMENT (#1039): the thread cap is per major, substituted into
                # this script when the seed is built — Podman 6 runs at 1, Podman 5
                # stays at 2 as the control.
                #
                # Every hypothesis for Podman 6's failing tail has been falsified in
                # turn: journald, SELinux, and a boot race on systemd-resolved, the
                # last one killed by its own instrumentation. What survives is the
                # shape of the error — the path that is missing is the mount
                # DESTINATION inside Podman's rootless-netns tree, not a host file,
                # which reads as the shared netns being torn down under a concurrent
                # container creation. One thread is the cheapest way to test that: if
                # the signature disappears, concurrency is the lever; if it survives,
                # this hypothesis dies too and the search moves elsewhere.
                #
                # `--test-threads` caps how many streaming tests hit the libpod
                # socket at once.
                #
                # This used to say the drops were specific to the nested-virt
                # (VM-in-runner) transport, and that a single-level VM "never
                # drops a byte". **That is measured false** (2026-08-03, #1322):
                # on a plain KVM guest with Podman 6.0.1, the same suite fails
                # 17 of 27 at eight test threads and 3 at one — a clean
                # dose-response curve in thread count, reproducible across
                # repetitions. Nesting makes it worse; it does not cause it.
                #
                # What holds is the lever: fewer concurrent streams means less
                # peak pressure,
                # which is the lever to shrink Podman 6's variable flaky tail toward
                # a small, stable set that an identity list can gate (#1039). Kept at
                # 2 rather than 1 so the suite still fits the VM's time budget.
                DROPPED='IncompleteMessage|connection closed before message completed|channel closed|Connection reset|error reading a body from connection|unexpected EOF during chunk size line|IncompleteBody|body-unexpected-eof'
                for attempt in 1 2; do
                  RUST_LOG=podup=warn cargo test --features test-helpers --test engine_integration -- --test-threads=__THREADS__ > /tmp/cargo.log 2>&1
                  RC=$?
                  [ "$RC" -eq 0 ] && break
                  grep -qE "$DROPPED" /tmp/cargo.log || break
                  echo "=== nested-virt transient on attempt $attempt; retrying suite ==="
                done
                tail -60 /tmp/cargo.log
                echo "=== failures section (full) ==="
                sed -n '/^failures:$/,/^test result:/p' /tmp/cargo.log | head -120
                # Machine-readable summary computed from the FULL log, using the same
                # drop signatures as the retry above; everything else counts as a real
                # failure.
                PASS=$(grep -oE 'test result: .* [0-9]+ passed' /tmp/cargo.log | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' | tail -1)
                FAIL=$(grep -oE '[0-9]+ failed' /tmp/cargo.log | grep -oE '[0-9]+' | tail -1)
                FLAKY=$(grep -cE "$DROPPED" /tmp/cargo.log)
                echo "PODUP_TESTS_RC=$RC"
                echo "PODUP_SUMMARY pass=${PASS:-0} fail=${FAIL:-0} flaky=${FLAKY:-0}"
                # Coverage, measured where the integration tests can actually run.
                # Reported, never gated — see the note where COVERAGE is set. A
                # failure here must not redden the leg: this is an observation, and
                # the suite's own result above is what gates.
                if [ "$COVERAGE" = "1" ]; then
                  # Nothing here redirects to /dev/console. This script runs as
                  # `tester`, which may not open that device, and a denied
                  # redirection aborts the command it was attached to and is
                  # reported as that command's own failure. The first run said
                  # `install-failed` for exactly that reason: cargo never ran.
                  # stdout and stderr already point at the console, inherited
                  # from the root caller that launched this script.
                  if cargo install cargo-llvm-cov --locked; then
                    cargo llvm-cov --all-features --summary-only >/tmp/cov.log 2>&1
                    PCT=$(awk '$1=="TOTAL" { for (i=1;i<=NF;i++) if ($i ~ /%$/) { print $i; exit } }' /tmp/cov.log)
                    if [ -n "$PCT" ]; then
                      echo "PODUP_COVERAGE=$PCT"
                    else
                      # Ran, produced nothing parseable. Print what it actually
                      # said: a second 15-minute boot is an expensive way to
                      # find out, and each distinct marker below names one
                      # cause instead of collapsing every failure into one word.
                      echo "PODUP_COVERAGE=no-total-line"
                      tail -30 /tmp/cov.log
                    fi
                  else
                    echo "PODUP_COVERAGE=install-failed"
                  fi
                fi
                # Emit the IDENTITIES of the failing tests, not just the count.
                # The floor gate can only tighten to a per-test known-flaky
                # allowlist once the flaky set is small and stable (#1039), and
                # building that allowlist starts with observing which tests
                # actually fail across nested-virt runs — which the count alone
                # cannot tell you. cargo prints a final `failures:` block of bare
                # test names (the earlier block carries `---- name stdout ----`
                # detail lines, which the 4-space-exact match skips); no failures
                # yields an empty list, not an error.
                FAILED_TESTS=$(sed -n '/^failures:$/,/^test result:/p' /tmp/cargo.log | grep -oE '^    [A-Za-z0-9_:]+$' | tr -d ' ' | paste -sd, -)
                echo "PODUP_FAILED_TESTS=${FAILED_TESTS}"
          runcmd:
            - bash -c 'F=$(findmnt -no FSTYPE /); case $F in btrfs) btrfs filesystem resize max / ;; xfs) xfs_growfs / ;; ext4) resize2fs $(findmnt -no SOURCE /) ;; esac >/dev/console 2>&1; echo "DISK=$(df -h / | tail -1)" >/dev/console'
            - bash -c 'dnf install -y podman rust cargo gcc git llvm >/dev/console 2>&1'
            # Prove the driver took, so a silently-ignored config cannot put the
            # logs tests back to passing without reading anything.
            - bash -c 'echo "LOGDRIVER=$(podman info --format {{.Host.LogDriver}} 2>/dev/null)" >/dev/console'
            - bash -c 'echo "PODMAN=$(podman --version)  RUST=$(rustc --version)" >/dev/console'
            - bash -c 'echo "tester:100000:65536" >/etc/subuid; echo "tester:100000:65536" >/etc/subgid'
            - bash -c 'loginctl enable-linger tester; sleep 6'
            - bash -c 'mkdir -p /mnt/repo && mount -t 9p -o trans=virtio,version=9p2000.L repo /mnt/repo && cp -a /mnt/repo /home/tester/podup && chown -R tester:tester /home/tester/podup'
            - bash -c 'sudo -iu tester /usr/local/bin/run-suite.sh >/dev/console 2>&1'
            - bash -c 'echo PROBE_DONE >/dev/console; sleep 2; poweroff'
          EOF
          # The seed heredoc is quoted, so the matrix value cannot expand inside
          # it. Substitute the per-major thread cap here instead (#1039).
          THREADS=2
          [ "${{ matrix.podman }}" = "6" ] && THREADS=1
          echo "test-threads for Podman ${{ matrix.podman }}: $THREADS"
          sed -i "s/__THREADS__/$THREADS/" "$RUNNER_TEMP/user-data"
          # Coverage on the scheduled and manual paths only. A pull request must
          # not pay for a second instrumented build, and must not be able to fail
          # for a reason that has nothing to do with its own change.
          COVERAGE=0
          case "${{ github.event_name }}" in schedule|workflow_dispatch) COVERAGE=1 ;; esac
          echo "coverage pass for Podman ${{ matrix.podman }}: $COVERAGE"
          sed -i "s/__COVERAGE__/$COVERAGE/" "$RUNNER_TEMP/user-data"
          cloud-localds "$RUNNER_TEMP/seed.iso" "$RUNNER_TEMP/user-data"
      - name: Boot VM (9p = repo only) + capture
        run: |
          # Raised with the job timeout for the one-thread experiment (#1039): qemu
          # has its own cap, and leaving it at 45m would kill the VM before the job
          # noticed, turning a slow run into an inconclusive one.
          sudo timeout 4200 qemu-system-x86_64 -enable-kvm -cpu host -m 6144 -smp 4 \
            -drive file="$RUNNER_TEMP/vm.qcow2",if=virtio,format=qcow2 \
            -drive file="$RUNNER_TEMP/seed.iso",if=virtio,format=raw \
            -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
            -virtfs local,path=${{ github.workspace }},mount_tag=repo,security_model=none,id=repo \
            -display none -serial stdio 2>&1 | tee "$RUNNER_TEMP/vm.log" || true
      - name: Verify podup core suite passed on the target Podman
        run: |
          L="$RUNNER_TEMP/vm.log"
          echo "=== key lines ==="; grep -E 'DISK=|PODMAN=|test result:|PODUP_TESTS_RC|No space' "$L" | tail -10 || true
          grep -q 'No space left' "$L" && { echo "::error::VM disk full — run invalid"; exit 1; }
          VER=$(grep -oE 'PODMAN=podman version [0-9.]+' "$L" | grep -oE '[0-9.]+' | tail -1)
          grep -qE 'PODMAN=podman version [0-9]' "$L" || { echo "::error::Podman not detected in VM"; exit 1; }
          # The VM must be able to serve logs. Gate on that, not on which driver
          # provides it: Fedora 44's journald cannot open its library here and every
          # logs request 500s, while rawhide's works fine — so requiring a specific
          # driver reddens the major that never had the problem.
          #
          # This is not cosmetic. With logs unavailable, the five tests that only
          # `unwrap()` the result passed without fetching a byte, because `logs`
          # swallowed the 500 and returned success. Green-and-meaningless is worse
          # than red, so the signature is a hard failure.
          echo "log driver: $(grep -oE 'LOGDRIVER=[a-z0-9-]+' "$L" | tail -1)"
          if grep -q 'unable to open a handle to the library' "$L"; then
            echo "::error::the VM could not serve logs (journald cannot open its library) — the logs tests would pass without reading anything"
            exit 1
          fi
          # Guard the matrix: the VM must actually run the Podman major it was asked to.
          case "$VER" in
            ${{ matrix.podman }}.*) : ;;
            *) echo "::error::expected Podman ${{ matrix.podman }}.x but VM has $VER"; exit 1 ;;
          esac
          # Read the machine-readable summary the VM computed from the FULL cargo
          # log (the console here is tail-truncated, so don't recount from it).
          SUM=$(grep -oE 'PODUP_SUMMARY pass=[0-9]+ fail=[0-9]+ flaky=[0-9]+' "$L" | tail -1)
          [ -n "$SUM" ] || { echo "::error::no PODUP_SUMMARY from VM on Podman $VER — suite did not report"; exit 1; }
          # Coverage, when this run asked for it. Reported into the job summary and
          # never gated: the org standard's 90% floor belongs here rather than on
          # the Podman-less job that can only see 79% (#1326), but a threshold set
          # from a number never observed in THIS environment would be a phantom
          # check. Observe first, then gate, in a separate change.
          COV=$(grep -oE 'PODUP_COVERAGE=[^ ]+' "$L" | tail -1 | cut -d= -f2)
          if [ -n "$COV" ]; then
            echo "coverage on Podman $VER (full suite, integration tests included): $COV"
            echo "- **Podman $VER coverage:** $COV" >> "$GITHUB_STEP_SUMMARY"
          fi
          PASS=$(echo "$SUM" | grep -oE 'pass=[0-9]+' | cut -d= -f2)
          FAIL=$(echo "$SUM" | grep -oE 'fail=[0-9]+' | cut -d= -f2)
          FLAKY=$(echo "$SUM" | grep -oE 'flaky=[0-9]+' | cut -d= -f2)
          PASS=${PASS:-0}; FAIL=${FAIL:-0}; FLAKY=${FLAKY:-0}
          echo "Podman $VER: $PASS passed, $FAIL failed ($FLAKY look like connection-drop flakes)"
          echo "Podman $VER ran on image: ${VM_IMAGE:-unknown}"
          # The run page, not just the log: whoever reads a red lane needs the
          # environment next to the counts, and the rawhide leg's environment
          # changes under it (#1222).
          {
            echo "### Podman $VER — $PASS passed, $FAIL failed, $FLAKY drop-like"
            echo ""
            echo "image: \`${VM_IMAGE:-unknown}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          # Strip CR: the VM talks to us over `-serial stdio`, so every line of
          # this log arrives CRLF-terminated. The counts survive because they are
          # extracted with numeric patterns, but the identity list keeps the CR on
          # its final element — which then matches nothing in the classified list
          # and reports the last failing test as an unexpected regression. That is
          # exactly how this gate false-reddened on its first run.
          FAILED_TESTS=$(grep -oE 'PODUP_FAILED_TESTS=.*' "$L" | tail -1 | cut -d= -f2- | tr -d '\r' || true)
          if [ -n "$FAILED_TESTS" ]; then
            echo "Failing tests on Podman $VER: $FAILED_TESTS"
          fi
          # Identity gate, per major, when that major has a classified list.
          # A count cannot tell a regression from noise: the #1072 regression
          # broke one test and left the pass count at 144, far above the floor,
          # so nothing went red and it shipped. WHICH tests fail does tell you.
          # Derive the major from the Podman the VM actually booted (the matrix
          # guard above already proved they agree), so dropping in a
          # podman-known-failures-<major> file is all it takes to gate a new
          # major — no edit here.
          major="${VER%%.*}"
          known="$GITHUB_WORKSPACE/.github/podman-known-failures-$major"
          if [ -f "$known" ]; then
            # `comm` compares bytes while `sort` orders by locale, so pin both to
            # C. Defensive rather than observed: the first-run false red was the
            # CR above, not collation, but the two must agree or comm reports
            # present entries as missing.
            LC_ALL=C
            export LC_ALL
            grep -vE '^[[:space:]]*(#|$)' "$known" | tr -d '[:blank:]' | sort -u > "$RUNNER_TEMP/known.txt"
            printf '%s' "$FAILED_TESTS" | tr ',' '\n' | sed '/^$/d' | sort -u > "$RUNNER_TEMP/failed.txt"
            unexpected="$(comm -23 "$RUNNER_TEMP/failed.txt" "$RUNNER_TEMP/known.txt")"
            if [ -n "$unexpected" ]; then
              echo "::error::Podman $VER: these failing tests are not in $(basename "$known") — a test that used to pass is failing, which is a regression, not nested-virt noise:"
              echo "$unexpected" | awk '{print "  " $0}'
              echo "Environment: Podman $VER on ${VM_IMAGE:-an unrecorded image}. Before concluding, check whether the run you are comparing against booted the same one — the rawhide leg usually does not (#1222)."
              echo "If a run proves the failure is environmental, add it to that file with the evidence; do not add it to make this red go away."
              exit 1
            fi
            stale="$(comm -13 "$RUNNER_TEMP/failed.txt" "$RUNNER_TEMP/known.txt")"
            if [ -n "$stale" ]; then
              echo "::notice::Podman $VER: listed as environmentally-broken but passing in this run — drop them from $(basename "$known") once that holds:"
              echo "$stale" | awk '{print "  " $0}'
            fi
            echo "Podman $VER: every failure is on the classified list ($(wc -l < "$RUNNER_TEMP/known.txt") entries)."
          fi
          # Gate: the core must pass the baseline in .github/podman-baseline-tests.
          # A real regression breaks previously-passing tests and knocks PASS
          # below the floor; the baseline is versioned so it is bumped
          # deliberately as the suite grows rather than sitting as a magic number
          # here.
          #
          # 2026-07-27: raised 115 -> 165 against a suite that now runs 172 on both
          # legs. At 115 the floor had 57 tests of slack, so a suite that executed
          # two thirds of itself and reported them all green would have passed the
          # only check that can see a half-executed run. 165 keeps a small margin
          # for the identity gate's own territory — a handful of classified
          # failures must not redden the floor too — without leaving room for a
          # third of the suite to vanish unnoticed.
          #
          # The floor is a second, cruder signal: it catches "fewer tests ran"
          # (a suite that half-executed reports few failures and few passes),
          # which the identity gate above cannot see. It stays for both majors.
          #
          # Why the failure COUNT is still only a warning: it never separated a
          # regression from noise — measured on this lane, Podman 5 fails the
          # same ~10 streaming/attach/run tests every run with ZERO
          # connection-drop signatures, so "FAIL <= drop count" would redden
          # every run. The identity gate replaces it for any major with a
          # classified list, and BOTH majors now have one.
          #
          # Podman 5's entries were each proved environmental by running the same
          # suite on a real host (155/155) while the lane reported failures.
          #
          # Podman 6 went without a list because its failing set carried a
          # variable tail that observation would have turned into false reds —
          # and the floor it gated on instead reported the leg green through 31
          # failures (141 passed, floor 115). That tail was one cause:
          # serialising the leg removed it, and its list is now empty, so any
          # failure there is a regression. See the file's own header for the
          # evidence and for how thin it is.
          BASELINE="$(cat "$GITHUB_WORKSPACE/.github/podman-baseline-tests")"
          [ "$PASS" -ge "$BASELINE" ] || { echo "::error::core suite degraded on Podman $VER ($PASS passed, baseline >= $BASELINE) — real regression or fewer tests ran"; exit 1; }
          if [ "$FAIL" -gt "$FLAKY" ]; then
            echo "::warning::Podman $VER: $FAIL failures, $FLAKY match a connection-drop signature — the rest are the known nested-virt-unstable subset (see the failures section). Not gated until that flakiness is reduced."
          fi
          echo "GREEN: podup core PASSED on Podman $VER ($PASS tests >= baseline $BASELINE; $FAIL in the nested-virt-noisy subset)."
