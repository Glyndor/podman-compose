# Compose-tool benchmark.
#
# The published numbers must come from a controlled runner (a self-hosted runner
# or the maintainer's machine), never a shared GitHub runner; shared runners are
# too noisy to be trustworthy. So this workflow has two jobs:
#
#   smoke      runs on a shared GitHub runner and validates the harness itself:
#                shell syntax, Python syntax, and the aggregation stats path run
#                against inline sample rows. It does NOT install Podman or drive
#                podup: ubuntu-latest ships Podman 4.9, below podup's floor
#                (Podman >= 5.0), so a shared-runner engine run would either fail
#                or exercise an unsupported configuration. It produces NO
#                published numbers and proves nothing about podup on real Podman.
#   benchmark  runs on a self-hosted runner (manual dispatch) over the full suite
#                and uploads the report artifact. It is skipped until a runner with
#                the `bench` label exists.
name: benchmark

# Three triggers, three questions:
# pull_request (with paths): did this PR break the harness code itself?
# workflow_dispatch: starts the engine job on the self-hosted runner.
# monthly schedule: keeps the engine job ticking so a missed dispatch is visible.
on:
  # The harness checks only guard anything if they run when the harness changes.
  # Until #1227 they fired on dispatch and the monthly cron alone, so a PR could
  # break run.sh or the timer and nothing would say so until the next 1st of the
  # month. The engine job below stays dispatch-only: it needs the bench runner.
  pull_request:
    paths:
      - "bench/**"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 4 1 * *" # monthly

permissions: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    # Bound: worst of the last three successful runs on 2026-09-02 was 17s. Ten times that, rounded up, never under ten
    # minutes; the six-hour default is what a hang would otherwise cost.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the harness shell syntax
        run: bash -n bench/run.sh
      - name: Check the harness Python syntax
        run: python3 -m py_compile bench/aggregate.py
      - name: Exercise the aggregation stats path on inline sample rows
        run: python3 bench/aggregate.py --self-test
      - name: Build the timer
        run: cargo build --release --manifest-path bench/timeit/Cargo.toml
      - name: Check the timer resolves below 10 ms
        # The defect this timer was written for was an instrument that could not
        # see under 10 ms, so it published `/bin/true` as 0.000 s. Assert the
        # observable effect (a non-zero wall clock and a plausible RSS) rather
        # than that the binary merely runs.
        run: |
          row="$(bench/timeit/target/release/timeit /bin/true)"
          echo "timeit /bin/true -> $row"
          # LC_ALL=C or a comma-decimal locale makes awk read "0.000626" as 0
          # and the first bound fires on a perfectly good measurement.
          echo "$row" | LC_ALL=C awk '{
            if ($1 <= 0 || $1 >= 0.010) { print "wall clock not resolved below 10 ms: " $1; exit 1 }
            if ($2 <= 0 || $2 > 4096) { print "max RSS implausible for /bin/true (KB): " $2; exit 1 }
            if ($4 != 0) { print "exit code should be 0, got " $4; exit 1 }
          }'

  benchmark:
    runs-on: [self-hosted, bench]
    # Bound: no successful scheduled run in the last three to measure; bounded generously and to be tightened from the first. Ten times that, rounded up, never under ten
    # minutes; the six-hour default is what a hang would otherwise cost.
    timeout-minutes: 90
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build podup
        run: cargo build --release --all-features --locked
      - name: Pre-pull pinned images
        run: |
          grep -rhoE 'docker\.io/[^ ]+@sha256:[a-f0-9]+' bench/scenarios | sort -u | while read -r img; do
            podman pull -q "$img"
          done
      - name: Run the full suite
        run: PODUP_BIN=target/release/podup bash bench/run.sh --iters 12 --warmup 2 --cores 2-9
      - name: Aggregate
        run: python3 bench/aggregate.py
      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-report
          path: bench/results/
