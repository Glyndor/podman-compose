name: Line limit (reusable)

# Enforce the file-size standard: warn past the soft limit, fail past the hard
# limit. Language-agnostic: it scans tracked source files by extension. Counts
# CODE lines only: blank lines and comment-only lines (including the required
# doc comments) do not count, so documenting a public API never pushes a file
# over the limit. The comment detection is a pragmatic heuristic (lines whose
# first non-space character starts a line/block/doc/template comment).

on:
  workflow_call:
    inputs:
      hard-limit:
        description: Files with more lines than this fail the build
        type: number
        default: 500
      soft-limit:
        description: Files with more lines than this emit a warning
        type: number
        default: 300
      extensions:
        description: Space-separated source file extensions to check
        # Pinned: a caller that passes a subset of the configured
        # extension list narrows what the line-limit gate covers
        # while the ruleset still requires `line limit`. Workflow
        # YAML is maintained under the same constraint as the rest
        # of the source; the gate must continue to read it.
        type: string
        default: "rs go ts tsx js jsx mjs cjs py sh astro vue svelte yml yaml"
      exclude-pattern:
        description: Optional extended regex; matching paths are skipped
        # Pinned: a caller that passes a different regex narrows what
        # the line-limit gate covers while the ruleset still
        # requires `line limit`. The bench scenarios are deliberately
        # oversized by the benchmark that runs on them, and a
        # maintainability warning there is noise. The condition: this
        # holds while bench/scenarios contains only generated or
        # deliberately-oversized fixtures. The day something
        # maintained by hand lands there, the exclusion is wrong and
        # this sentence is where it says so.
        type: string
        default: "^bench/scenarios/"

permissions:
  contents: read

concurrency:
  group: line-limit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  line-limit:
    name: line limit
    runs-on: ubuntu-latest
    # Bound: worst of the last three successful runs on 2026-09-02 was 8s. Ten times that, rounded up, never under ten
    # minutes; the six-hour default is what a hang would otherwise cost.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check file lengths
        env:
          HARD: ${{ inputs.hard-limit }}
          SOFT: ${{ inputs.soft-limit }}
          EXTS: ${{ inputs.extensions }}
          EXCLUDE: ${{ inputs.exclude-pattern }}
        run: |
          set -euo pipefail
          ext_re="$(echo "$EXTS" | tr ' ' '|')"
          ext_pattern="\.(${ext_re})\$"
          fail=0
          while IFS= read -r -d '' f; do
            [[ "$f" =~ $ext_pattern ]] || continue
            [ -f "$f" ] || continue
            case "$f" in
              vendor/*|*/vendor/*|*.min.*) continue ;;
            esac
            if [ -n "$EXCLUDE" ] && echo "$f" | grep -qE "$EXCLUDE"; then
              continue
            fi
            # `#` starts a comment only in hash-comment languages; in Rust it
            # begins an attribute (#[...]/#![...]), so don't drop those lines.
            case "$f" in
              *.sh|*.bash|*.py|*.rb|*.pl|*.yml|*.yaml|*.toml) hash_comment=1 ;;
              *) hash_comment=0 ;;
            esac
            n="$(awk -v hc="$hash_comment" '
              { line = $0; sub(/^[[:space:]]+/, "", line)
                if (line == "") next
                if (line ~ /^(\/\/|\*|\/\*|\*\/|<!--)/) next
                if (hc == 1 && line ~ /^#/) next
                code++ }
              END { print code + 0 }' "$f")"
            if [ "$n" -gt "$HARD" ]; then
              echo "::error file=$f::$f has $n code lines (hard limit $HARD, split required)"
              fail=1
            elif [ "$n" -gt "$SOFT" ]; then
              echo "::warning file=$f::$f has $n code lines (soft limit $SOFT, look for a split point)"
            fi
          done < <(git ls-files -z)
          if [ "$fail" -ne 0 ]; then
            echo "Some files exceed the ${HARD}-line hard limit."
            exit 1
          fi
          echo "All checked files are within the ${HARD}-line hard limit."
