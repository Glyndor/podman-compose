name: Fuzz

on:
  schedule:
    - cron: "0 7 * * 1"  # Every Monday at 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: cargo fuzz (smoke)
    uses: Glyndor/.github/.github/workflows/rust-fuzz.yml@c958978687af37dc2d826a967d9c549589afb39f # v1.14.1
    with:
      targets: '["parse_compose", "substitute", "size", "dotenv", "stream_frame", "stream_ndjson"]'
      max-total-time: "60"
      timeout: "10"
      rss-limit-mb: "2048"
