name: Fuzz

on:
  schedule:
    - cron: "0 7 * * 1"  # Every Monday at 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: cargo fuzz (smoke)
    uses: ./.github/workflows/reusable-rust-fuzz.yml
    with:
      targets: '["parse_compose", "substitute", "size", "dotenv", "stream_frame", "stream_ndjson", "extract_tar"]'
      max-total-time: "60"
      timeout: "10"
      rss-limit-mb: "2048"
