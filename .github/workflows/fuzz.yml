name: Fuzz

on:
  schedule:
    - cron: "0 7 * * 1"  # Every Monday at 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: cargo fuzz (smoke)
    uses: Glyndor/.github/.github/workflows/rust-fuzz.yml@045903bf83a58651f119bc7d952aa45242b897c5 # v1.12.0
    with:
      targets: '["parse_compose", "substitute", "size", "dotenv", "stream_frame"]'
      max-total-time: "60"
      timeout: "10"
      rss-limit-mb: "2048"
