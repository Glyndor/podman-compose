name: Fuzz

on:
  schedule:
    - cron: "0 7 * * 1"  # Every Monday at 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: cargo fuzz (smoke)
    uses: Glyndor/.github/.github/workflows/rust-fuzz.yml@118244b8d758bdec6d2c5115d815dbc2e5c4f4e9 # v1.16.0
    with:
      targets: '["parse_compose", "substitute", "size", "dotenv", "stream_frame", "stream_ndjson", "extract_tar"]'
      max-total-time: "60"
      timeout: "10"
      rss-limit-mb: "2048"
