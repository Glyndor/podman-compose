name: Lint shell scripts

on:
  push:
    branches:
      - develop
    paths:
      - "**.sh"
      - ".github/workflows/lint-shell.yml"
      # While this reusable was a pinned Glyndor/.github reference, a change
      # to it arrived as a Dependabot commit editing the line above, which
      # this filter already matched. A local copy is edited directly, so
      # without this line a pull request that touches only the reusable
      # merges without ever running it.
      - ".github/workflows/reusable-shell-ci.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "**.sh"
      - ".github/workflows/lint-shell.yml"
      # While this reusable was a pinned Glyndor/.github reference, a change
      # to it arrived as a Dependabot commit editing the line above, which
      # this filter already matched. A local copy is edited directly, so
      # without this line a pull request that touches only the reusable
      # merges without ever running it.
      - ".github/workflows/reusable-shell-ci.yml"

permissions:
  contents: read

jobs:
  shellcheck:
    uses: ./.github/workflows/reusable-shell-ci.yml
    with:
      # A test no workflow runs is indistinguishable from one that passes --
      # the lesson debian-build.yml carries from #1295, applied here.
      test-command: ./tests/shell/locale-pinned.test.sh && ./tests/shell/ci-runs-every-test.test.sh
