# The x86_64 musl target links a static PIE by itself. The aarch64 musl
# target does not (rustc 1.98 lacks the flag for it), and the plain static
# executable it produces has no ASLR: podup-linux-arm64 and the arm64 .deb
# shipped that way through 5.7.0. For that target the link goes to rust-lld
# without rustc's own CRT objects, and build.rs supplies the static-PIE set
# and flags; see the comment there. This applies to every cargo invocation
# in the tree: the release build, the Debian build, tests and the CI job
# that runs the result on an arm64 runner.
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "link-self-contained=no"]

# Control Flow Guard is opt-in on rustc for both MSVC targets, so enable it
# in rustflags. rustc's MSVC default leaves GUARD_CF (0x4000) in the
# optional header's DllCharacteristics unset, and the release-time PE check
# in .github/scripts/check-hardening.ps1 reads that field and refuses a
# binary without it; without this flag a passing Windows build would fail
# the new gate. DYNAMIC_BASE, HIGH_ENTROPY_VA and NX_COMPAT are emitted by
# the MSVC default and require no rustflag.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "control-flow-guard"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "control-flow-guard"]
